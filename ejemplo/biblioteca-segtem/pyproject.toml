[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-biblioteca-segtem-meta-calidad"
version = "0.1.0"
description = "Biblioteca de ejemplo, sólo datos, para Oracle"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["oracle_bibliotecas*"]
namespaces = true

[tool.setuptools.package-data]
"oracle_bibliotecas.oracle_biblioteca_segtem_meta_calidad" = [
  "oracle-biblioteca.toml",
  "catalogos/*.oracle",
  "corpus/*.caso",
]
