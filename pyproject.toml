[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-metalenguaje"
dynamic = ["version"]
description = "Metalenguaje para medir evidencia, alcance y mutación sin acoplarse a un dominio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Hollweg", email = "brianhollweg@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
# Sin clasificadores, PyPI no puede filtrar el paquete por nada: ni por versión de Python, ni por
# estado, ni por tema. «4 - Beta» y no «5 - Production/Stable» porque el README dice EXPERIMENTAL en
# la primera pantalla, y decir dos cosas distintas en dos lugares es exactamente lo que este
# proyecto persigue en otros lados.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# Hasta 0.3.0 la página de PyPI no tenía UN SOLO enlace: ni al repositorio, ni al sitio, ni a los
# issues. La descripción invita a leer nueve decisiones y quien llegaba ahí no tenía cómo abrirlas.
[project.urls]
"Repositorio" = "https://github.com/Segtem/oracle"
"Sitio" = "https://segtem.github.io/oracle/"
"Manual" = "https://segtem.github.io/oracle/manual.html"
"Documentación" = "https://github.com/Segtem/oracle/blob/main/docs/README.md"
"Especificación" = "https://github.com/Segtem/oracle/blob/main/ESPECIFICACION.md"
"Issues" = "https://github.com/Segtem/oracle/issues"
"Cambios" = "https://github.com/Segtem/oracle/blob/main/NOTAS-DE-RELEASE.md"

[project.scripts]
oracle = "oracle_metalenguaje.tools.cli:main"
oracle-aceptacion = "oracle_metalenguaje.tools.aceptacion:main"
oracle-corpus = "oracle_metalenguaje.tools.corpus:main"
oracle-diferencial = "oracle_metalenguaje.tools.diferencial:main"
oracle-estudio = "oracle_metalenguaje.tools.estudio:main"
oracle-lsp = "oracle_metalenguaje.tools.lsp:main"
oracle-mcp = "oracle_metalenguaje.tools.mcp:main"
oracle-medida = "oracle_metalenguaje.tools.medida:main"
oracle-mutar = "oracle_metalenguaje.tools.mutar:main"
oracle-mutar-codigo = "oracle_metalenguaje.tools.mutar_codigo:main"

[tool.setuptools.dynamic]
version = { attr = "nucleo.version.VERSION_DISTRIBUCION" }

[tool.setuptools]
include-package-data = true
packages = [
  "oracle_metalenguaje",
  "oracle_metalenguaje.catalogos",
  "oracle_metalenguaje.nucleo",
  "oracle_metalenguaje.nucleo.aislamiento",
  "oracle_metalenguaje.perfiles",
  "oracle_metalenguaje.perfiles.python",
  "oracle_metalenguaje.relaciones",
  "oracle_metalenguaje.tools",
]

[tool.setuptools.package-dir]
"oracle_metalenguaje.catalogos" = "catalogos"
"oracle_metalenguaje.nucleo" = "nucleo"
"oracle_metalenguaje.nucleo.aislamiento" = "nucleo/aislamiento"
"oracle_metalenguaje.perfiles" = "perfiles"
"oracle_metalenguaje.perfiles.python" = "perfiles/python"
"oracle_metalenguaje.relaciones" = "relaciones"
"oracle_metalenguaje.tools" = "tools"

[tool.setuptools.package-data]
"oracle_metalenguaje.catalogos" = ["**/*.json", "**/*.oracle"]
"oracle_metalenguaje.nucleo" = ["macros/*.json", "macros/*.oracle"]
"oracle_metalenguaje.perfiles.python" = ["catalogos/**/*.json", "catalogos/**/*.oracle"]
"oracle_metalenguaje.relaciones" = ["*.json"]
