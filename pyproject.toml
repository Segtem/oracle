[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-metalenguaje"
dynamic = ["version"]
description = "Metalenguaje para medir evidencia, alcance y mutación sin acoplarse a un dominio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Hollweg", email = "brianhollweg@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
oracle = "oracle_metalenguaje.tools.cli:main"
oracle-aceptacion = "oracle_metalenguaje.tools.aceptacion:main"
oracle-corpus = "oracle_metalenguaje.tools.corpus:main"
oracle-diferencial = "oracle_metalenguaje.tools.diferencial:main"
oracle-estudio = "oracle_metalenguaje.tools.estudio:main"
oracle-medida = "oracle_metalenguaje.tools.medida:main"
oracle-mutar = "oracle_metalenguaje.tools.mutar:main"
oracle-mutar-codigo = "oracle_metalenguaje.tools.mutar_codigo:main"

[tool.setuptools.dynamic]
version = { attr = "nucleo.version.VERSION_DISTRIBUCION" }

[tool.setuptools]
include-package-data = true
packages = [
  "oracle_metalenguaje",
  "oracle_metalenguaje.catalogos",
  "oracle_metalenguaje.nucleo",
  "oracle_metalenguaje.nucleo.aislamiento",
  "oracle_metalenguaje.perfiles",
  "oracle_metalenguaje.perfiles.python",
  "oracle_metalenguaje.tools",
]

[tool.setuptools.package-dir]
"oracle_metalenguaje.catalogos" = "catalogos"
"oracle_metalenguaje.nucleo" = "nucleo"
"oracle_metalenguaje.nucleo.aislamiento" = "nucleo/aislamiento"
"oracle_metalenguaje.perfiles" = "perfiles"
"oracle_metalenguaje.perfiles.python" = "perfiles/python"
"oracle_metalenguaje.tools" = "tools"

[tool.setuptools.package-data]
"oracle_metalenguaje.catalogos" = ["**/*.json", "**/*.oracle"]
"oracle_metalenguaje.nucleo" = ["macros/*.json", "macros/*.oracle"]
"oracle_metalenguaje.perfiles.python" = ["catalogos/**/*.json", "catalogos/**/*.oracle"]
