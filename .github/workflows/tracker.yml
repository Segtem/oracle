name: tracker

# `verificar.yml` ignoraba `**.md`, y un `tareas/*/TAREA.md` es un .md: un push que sólo tocaba el
# tracker no disparaba NADA. Pasó con el push de `20260915-023750-tql`, que no dejó una sola corrida.
# Un enlace roto o un adjunto sin commitear recién aparecía con el próximo push de código, y le
# ensuciaba el rojo a un cambio que no tenía nada que ver.
#
# Va aparte de `verificar.yml` por dos razones:
#   · `tareas/**` tiene un `paths` propio y queda fuera del filtro de `verificar.yml`.
#   · `concurrency` es por grupo, y el de `verificar` cancela lo que esté corriendo en la rama. Una
#     corrida manual de mutación de código tarda horas; un push al tracker la mataba. Con su propio
#     grupo, el tracker sólo se cancela a sí mismo.
on:
  push:
    paths: ["tareas/**"]
  pull_request:
    paths: ["tareas/**"]
  workflow_dispatch:

concurrency:
  group: tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  juzgar-el-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # La historia entera: el tracker emite un hecho por commit, y con el checkout
        # superficial por omisión la política de cierres veía uno solo (0.25.2: 30 en vez de 4).
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "setuptools>=68"
      - run: python -m pip install --no-deps .
      # Las mismas dos líneas que corre `verificar.yml` cuando cambia el código: referencias locales
      # presentes, archivos confirmados sin cambios y lectura sin omisiones.
      - name: juzgar el tracker de Oracle
        run: |
          python tools/cli.py tarea hechos --git > /tmp/hechos-tareas.json
          python tools/cli.py juzgar --proyecto ejemplo/seguimiento-tareas --con /tmp/hechos-tareas.json
